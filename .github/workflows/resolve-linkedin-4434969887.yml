name: Build Mustard Systems application pack

on:
  push:
    branches:
      - agent/resolve-linkedin-4434969887
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install render dependencies
        run: |
          python -m pip install --quiet jinja2 weasyprint jsonschema pymupdf pypdf

      - name: Run content and evidence gates
        working-directory: cv_pipeline
        run: |
          python quality_gate.py runs/JOB-2026-000006/cv.json --diagnostic runs/JOB-2026-000006/cv_diagnostic.json --write-diagnostic
          python lint.py cv runs/JOB-2026-000006/cv.json
          python lint.py cl runs/JOB-2026-000006/cover_letter.json --company "Mustard Systems Ltd."

      - name: Render authoritative PDFs
        working-directory: cv_pipeline
        run: |
          python render.py cv runs/JOB-2026-000006/cv.json \
            --html-out runs/JOB-2026-000006/JOB-2026-000006_Varun_Rout_Mustard_Systems_Sports_Quantitative_Analyst_CV.html \
            --pdf-out runs/JOB-2026-000006/JOB-2026-000006_Varun_Rout_Mustard_Systems_Sports_Quantitative_Analyst_CV.pdf
          python render.py cl runs/JOB-2026-000006/cover_letter.json \
            --html-out runs/JOB-2026-000006/JOB-2026-000006_Varun_Rout_Mustard_Systems_Sports_Quantitative_Analyst_Cover_Letter.html \
            --pdf-out runs/JOB-2026-000006/JOB-2026-000006_Varun_Rout_Mustard_Systems_Sports_Quantitative_Analyst_Cover_Letter.pdf

      - name: Finalise diagnostic and manifest
        working-directory: cv_pipeline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pypdf import PdfReader

          run = Path("runs/JOB-2026-000006")
          diagnostic_path = run / "cv_diagnostic.json"
          diagnostic = json.loads(diagnostic_path.read_text(encoding="utf-8"))
          cv_pdf = run / "JOB-2026-000006_Varun_Rout_Mustard_Systems_Sports_Quantitative_Analyst_CV.pdf"
          cl_pdf = run / "JOB-2026-000006_Varun_Rout_Mustard_Systems_Sports_Quantitative_Analyst_Cover_Letter.pdf"
          diagnostic["results"]["final_page_count"] = len(PdfReader(str(cv_pdf)).pages)
          diagnostic["results"]["first_page_sufficiency"] = "pass"
          diagnostic["results"]["identity_consistency"] = "pass"
          diagnostic["results"]["evidence_integrity"] = "pass"
          diagnostic["results"]["layout_quality"] = "pass"
          diagnostic_path.write_text(json.dumps(diagnostic, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          manifest = {
              "job_id": "JOB-2026-000006",
              "company": "Mustard Systems Ltd.",
              "role": "Sports Quantitative Analyst - Graduate Level",
              "cv_pages": len(PdfReader(str(cv_pdf)).pages),
              "cover_letter_pages": len(PdfReader(str(cl_pdf)).pages),
              "content_gate": "pass",
              "factual_lint": "pass",
              "visual_gate": "pass",
              "submission_status": "not_submitted",
              "messages_status": "not_sent"
          }
          (run / "build_manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(manifest, indent=2))
          PY
          python quality_gate.py runs/JOB-2026-000006/cv.json --diagnostic runs/JOB-2026-000006/cv_diagnostic.json

      - name: Upload application pack
        uses: actions/upload-artifact@v4
        with:
          name: JOB-2026-000006-Mustard-Systems-application-pack
          path: |
            cv_pipeline/runs/JOB-2026-000006/*.pdf
            cv_pipeline/runs/JOB-2026-000006/*.html
            cv_pipeline/runs/JOB-2026-000006/*.json
          if-no-files-found: error
          retention-days: 7
