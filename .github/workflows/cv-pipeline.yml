name: CV pipeline checks

on:
  pull_request:
    paths: ['cv_pipeline/**', 'RULES.md', 'MASTER_PROFILE.md', 'COMMAND.md', 'Agents/WORKFLOW_CONTROLLER.md', 'CV_ARCHETYPE_ARCHITECTURE.md', '.github/workflows/cv-pipeline.yml']
  push:
    branches: [main]
    paths: ['cv_pipeline/**', 'RULES.md', 'MASTER_PROFILE.md', 'COMMAND.md', 'Agents/WORKFLOW_CONTROLLER.md', 'CV_ARCHETYPE_ARCHITECTURE.md', '.github/workflows/cv-pipeline.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CV serif fonts
        run: |
          set -euo pipefail
          FONT_COMMIT="352f6b7d9d6cc4fa9e242b931291d31b21a6dc84"
          FONT_DIR="$HOME/.local/share/fonts/jobhuntai"
          mkdir -p "$FONT_DIR"
          curl -fsSL "https://raw.githubusercontent.com/google/fonts/${FONT_COMMIT}/ofl/cormorantgaramond/CormorantGaramond%5Bwght%5D.ttf" -o "$FONT_DIR/CormorantGaramond.ttf"
          curl -fsSL "https://raw.githubusercontent.com/google/fonts/${FONT_COMMIT}/ofl/lora/Lora%5Bwght%5D.ttf" -o "$FONT_DIR/Lora.ttf"
          curl -fsSL "https://raw.githubusercontent.com/google/fonts/${FONT_COMMIT}/ofl/lora/Lora-Italic%5Bwght%5D.ttf" -o "$FONT_DIR/Lora-Italic.ttf"
          fc-cache -f "$FONT_DIR"
          fc-match "Cormorant Garamond" | grep -qi "Cormorant"
          fc-match "Lora" | grep -qi "Lora"
      - run: python -m pip install --upgrade pip jsonschema pypdf pymupdf jinja2 weasyprint
      - name: Compile
        run: >-
          python -m py_compile
          cv_pipeline/quality_gate.py
          cv_pipeline/archetype_quality_gate.py
          cv_pipeline/cv_length_gate.py
          cv_pipeline/composition_gate.py
          cv_pipeline/pipeline_gate.py
          cv_pipeline/role_identity.py
          cv_pipeline/evidence_scoring.py
          cv_pipeline/positioning_pipeline.py
          cv_pipeline/review_loop.py
          cv_pipeline/application_quality_gate.py
          cv_pipeline/rendered_visual_gate.py
          cv_pipeline/render_gate.py
          cv_pipeline/archetype_render_gate.py
          cv_pipeline/cover_letter_render_gate.py
          cv_pipeline/visual_gate.py
          cv_pipeline/visual_contract_gate.py
          cv_pipeline/archetype_visual_gate.py
          cv_pipeline/render.py
          cv_pipeline/lint.py
      - name: Sports production render test
        working-directory: cv_pipeline
        run: python tmp_sports_render.py
      - name: Upload sports production render
        uses: actions/upload-artifact@v4
        with:
          name: sports-production-render
          path: cv_pipeline/tmp_sports_output/
          if-no-files-found: error
      - name: Mandatory Tailor and Review loop
        working-directory: cv_pipeline
        run: python tests/test_review_loop.py -v
      - name: Review panel lane ownership
        working-directory: cv_pipeline
        run: python tests/test_review_panel_integration.py -v
      - name: CV length and evidence retention gate
        working-directory: cv_pipeline
        run: python tests/test_cv_length_gate.py -v
      - name: Composition depth and page-fill gate
        working-directory: cv_pipeline
        run: python tests/test_composition_gate.py -v
      - name: Exact rendered-page release gate
        working-directory: cv_pipeline
        run: python tests/test_rendered_visual_gate.py -v
      - name: Final application quality gate
        working-directory: cv_pipeline
        run: python tests/test_application_quality_gate.py -v
      - name: Locked legacy HTML visual contract
        run: python cv_pipeline/visual_gate.py
      - name: Legacy visual compatibility entrypoint
        run: python cv_pipeline/visual_contract_gate.py
      - name: Canonical legacy templates pass
        working-directory: cv_pipeline
        run: python tests/test_visual_contract.py VisualContractTests.test_locked_templates_pass -v
      - name: Archetype template contract passes
        working-directory: cv_pipeline
        run: python tests/test_archetype_visual_contract.py ArchetypeVisualContractTests.test_dynamic_template_contract_passes -v
      - name: Rendered legacy CV geometry passes
        working-directory: cv_pipeline
        run: python tests/test_visual_contract.py VisualContractTests.test_rendered_cv_passes_pdf_acceptance -v
      - name: Rendered archetype CV geometry passes
        working-directory: cv_pipeline
        run: python tests/test_archetype_visual_contract.py ArchetypeVisualContractTests.test_strategy_section_order_and_labels_render -v
      - name: Upload CV visual diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cv-visual-diagnostic
          path: cv_pipeline/visual-diagnostic.json
          if-no-files-found: ignore
      - name: Bullet-indent regression is caught
        working-directory: cv_pipeline
        run: python tests/test_visual_contract.py VisualContractTests.test_wrapped_bullet_extra_indent_is_blocked -v
      - name: Rendered cover-letter geometry passes
        working-directory: cv_pipeline
        run: python tests/test_visual_contract.py VisualContractTests.test_rendered_cover_letter_passes_visual_geometry -v
      - name: Upload cover-letter visual diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cover-letter-visual-diagnostic
          path: cv_pipeline/visual-diagnostic.json
          if-no-files-found: ignore
      - name: Cover-letter grid regression is caught
        working-directory: cv_pipeline
        run: python tests/test_visual_contract.py VisualContractTests.test_shifted_cover_letter_meta_row_is_blocked -v
      - name: Static visual mutations are caught
        working-directory: cv_pipeline
        run: |
          python tests/test_visual_contract.py VisualContractTests.test_selected_projects_is_blocked -v
          python tests/test_visual_contract.py VisualContractTests.test_bullet_css_drift_is_blocked -v
          python tests/test_visual_contract.py VisualContractTests.test_cover_letter_table_is_blocked -v
          python tests/test_archetype_visual_contract.py ArchetypeVisualContractTests.test_selected_projects_remains_forbidden -v
      - name: Structural, archetype, review-loop and factual regression suite
        working-directory: cv_pipeline
        run: python -m unittest discover -s tests -v
