name: Temporary LinkedIn fetch 4447009580

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-linkedin-fetch-4447009580.yml
      - tmp/linkedin-fetch-4447009580.md

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch LinkedIn guest job posting
        run: |
          mkdir -p fetched
          curl --fail --location --retry 3 \
            --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36' \
            'https://www.linkedin.com/jobs-guest/jobs/api/jobPosting/4447009580' \
            --output fetched/linkedin-job-4447009580.html
          test -s fetched/linkedin-job-4447009580.html
      - name: Upload fetched posting
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-job-4447009580
          path: fetched/linkedin-job-4447009580.html
          if-no-files-found: error
